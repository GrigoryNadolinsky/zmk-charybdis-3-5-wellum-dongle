# ---- Правая половина ----
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_ZMK_SPLIT_BLE=y
CONFIG_ZMK_SPLIT_BLE_PERIPHERAL=y

# Предпочтительные интервалы соединения
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=6
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=6
CONFIG_BT_PERIPHERAL_PREF_LATENCY=0

# PHY / MTU / длина пакета согласованы с центральным
CONFIG_BT_CTLR_PHY_2M=y
CONFIG_BT_CTLR_DATA_LENGTH_MAX=69
CONFIG_BT_L2CAP_TX_MTU=128

# Аппаратная часть
CONFIG_SPI=y
CONFIG_INPUT=y
CONFIG_PMW3610=y
CONFIG_ZMK_MOUSE=y
CONFIG_ZMK_EXT_POWER=y

# Настройки сенсора PMW3610
CONFIG_PMW3610_SWAP_XY=y
CONFIG_PMW3610_INVERT_X=y
CONFIG_PMW3610_INVERT_Y=y

CONFIG_PMW3610_SMART_ALGORITHM=y
CONFIG_PMW3610_MACCEL=y
CONFIG_PMW3610_MACCEL_TAKEOFF=200
CONFIG_PMW3610_MACCEL_GROWTH_RATE=025
CONFIG_PMW3610_MACCEL_OFFSET=220
CONFIG_PMW3610_MACCEL_LIMIT=020

CONFIG_PMW3610_RUN_DOWNSHIFT_TIME_MS=3264
CONFIG_PMW3610_REST1_SAMPLE_TIME_MS=20
CONFIG_PMW3610_REPORT_INTERVAL_MIN=8
