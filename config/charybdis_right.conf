# --- Core drivers ---
CONFIG_SPI=y
CONFIG_INPUT=y
CONFIG_ZMK_MOUSE=y
CONFIG_ZMK_EXT_POWER=y
CONFIG_PMW3610=y

# --- Sensor orientation & behavior ---
CONFIG_PMW3610_SWAP_XY=y
CONFIG_PMW3610_INVERT_X=y
# CONFIG_PMW3610_INVERT_Y=y
CONFIG_PMW3610_ORIENTATION_90=y

# --- Base CPI configuration ---
CONFIG_PMW3610_CPI=2000
CONFIG_PMW3610_CPI_DIVIDOR=4

# --- Snipe mode ---
CONFIG_PMW3610_SNIPE_CPI=800
CONFIG_PMW3610_SNIPE_CPI_DIVIDOR=4

# --- Scroll configuration ---
CONFIG_PMW3610_SCROLL_TICK=32
CONFIG_PMW3610_INVERT_SCROLL_Y=n

# --- Timing & power-down behavior ---
CONFIG_PMW3610_RUN_DOWNSHIFT_TIME_MS=3264
CONFIG_PMW3610_REST1_SAMPLE_TIME_MS=20
#CONFIG_PMW3610_REST1_DOWNSHIFT_TIME_MS=9600
#CONFIG_PMW3610_REST2_SAMPLE_TIME_MS=200
#CONFIG_PMW3610_REST2_DOWNSHIFT_TIME_MS=30000
#CONFIG_PMW3610_REST3_SAMPLE_TIME_MS=300
#CONFIG_PMW3610_REST3_DOWNSHIFT_TIME_MS=50000
#CONFIG_PMW3610_FORCE_AWAKE=n

# --- Smart algorithm & automouse ---
CONFIG_PMW3610_SMART_ALGORITHM=y
CONFIG_PMW3610_AUTOMOUSE_TIMEOUT_MS=400

# --- Polling rate ---
CONFIG_PMW3610_POLLING_RATE_125_SW=y

# --- MACCEL (mouse acceleration) ---
CONFIG_PMW3610_MACCEL=y
CONFIG_PMW3610_MACCEL_TAKEOFF=200
CONFIG_PMW3610_MACCEL_GROWTH_RATE=025
CONFIG_PMW3610_MACCEL_OFFSET=220
CONFIG_PMW3610_MACCEL_LIMIT=020

# --- Report rate ---
CONFIG_PMW3610_REPORT_INTERVAL_MIN=8

# --- Optional debug & Bluetooth tuning ---
#CONFIG_SPI_LOG_LEVEL_DBG=y
#CONFIG_BT_PERIPHERAL_PREF_MAX_INT=9
#CONFIG_BT_PERIPHERAL_PREF_LATENCY=16
#CONFIG_BT_BUF_ACL_TX_COUNT=32
#CONFIG_BT_L2CAP_TX_BUF_COUNT=32
