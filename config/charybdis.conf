# ---- Центральный узел (донгл) ----
CONFIG_BT=y
CONFIG_BT_CENTRAL=y
CONFIG_ZMK_SPLIT_BLE=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL=y

# Разрешаем несколько подключений (2 половины + запас)
CONFIG_BT_MAX_CONN=3
CONFIG_BT_MAX_PAIRED=3

# Мощность передачи (для nRF52840)
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Оптимизация соединений
CONFIG_BT_BUF_ACL_TX_COUNT=48
CONFIG_BT_L2CAP_TX_BUF_COUNT=48
CONFIG_BT_CTLR_DATA_LENGTH_MAX=69
CONFIG_BT_CTLR_PHY_2M=y
CONFIG_BT_L2CAP_TX_MTU=128

# Очередь поведения и прокси заряда
CONFIG_ZMK_BEHAVIORS_QUEUE_SIZE=512
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y

# Экспериментальные BLE-фичи — временно выключено для стабильности
# CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y

# Включить логирование для диагностики
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=4
CONFIG_ZMK_BLE_CONSOLE=y

# Мышь (для trackball режима донгла, если нужно)
CONFIG_ZMK_MOUSE=y
